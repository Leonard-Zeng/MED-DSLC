[project]
name = "med-lcds"
version = "0.1.0"
description = "Curated MED-LCDS training and evaluation pipeline."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy==1.25.2",
    "scipy==1.11.4",
    "scikit-learn==1.6.1",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "torchaudio==2.11.0",
    "opencv-python-headless",
    "pyarrow==15.0.2",
    "img2dataset==1.45.0",
    "open-clip-torch",
    "gdown",
    "matplotlib",
    "pytest",
    "jupyterlab",
    "ipywidgets",
    "braceexpand",
    "datasets",
    "webdataset",
    "pycocotools",
    "pandas",
    "openpyxl",
    "pandas-stubs~=2.3.3",
]

[tool.uv]
package = false
