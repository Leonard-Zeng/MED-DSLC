name: Deploy project website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare standalone page
        run: |
          mkdir -p "$RUNNER_TEMP/med-dslc-site"
          cp website/index.html "$RUNNER_TEMP/med-dslc-site/index.html"
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/med-dslc-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
